databases:
  - name: debtor-info-db
    plan: free
    databaseName: bankruptcy_app

services:
  - type: web
    name: debtor-info
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: debtor-info-db
          property: connectionString
